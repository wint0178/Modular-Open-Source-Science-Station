#####################################################################################
# PROJECT NAME: ESP32 Tailscale + BME680
# VERSION: 1.0.3 (Multi-Board Instance Template)
# COLLABORATORS: Brandon J. Winters, Ph.D. & Gemini (AI Adaptive Collaborator)
# REPOSITORY ORIGIN: Developed for secure remote ESP32-S3 sensor deployment via Tailscale.
# DATE: June 2026
#####################################################################################

substitutions:
  master_update_interval: "60s"
  # Increment this ID for each new board instance
  device_id: "evm04" 

esphome:
  name: "${device_id}"
  friendly_name: "${device_id}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf             

# Import Tailscale VPN logic from GitHub
external_components:
  - source: github://Csontikka/esphome-tailscale

# VPN Tunneling configuration
tailscale:
  auth_key: !secret tailscale_auth_key
  hostname: "${device_id}"    

# Required switch for the Tailscale component to toggle debug info in logs
switch:
  - platform: template
    name: "${device_id} Tailscale Logs"
    id: tailscale_debug_switch
    optimistic: true

logger:                       

# Home Assistant Native API
api:
  encryption:
    key: !secret esphome_api_key
  reboot_timeout: 0s                

# Wireless Update Security
ota:
  - platform: esphome
    password: !secret esphome_ota_password

# Wireless Networking
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  use_address: "${device_id}"        
  reboot_timeout: 1min              
  power_save_mode: light      
  
  # Fallback hotspot for local configuration
  ap:
    ssid: "${device_id}-AP"
    password: !secret wifi_ap_password

# --- INTERNAL RGB LED CONTROL ---
light:
  - platform: esp32_rmt_led_strip
    id: internal_status_led
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF  

button:
  - platform: template
    name: "Identify ${device_id}"
    icon: "mdi:led-on"
    on_press:
      then:
        - light.turn_on:
            id: internal_status_led
            brightness: 50%
            red: 0%
            green: 100%
            blue: 0%
        - delay: 5s
        - light.turn_off: internal_status_led

# MQTT Broker Communication
mqtt:
  broker: !secret mqtt_broker_ip    
  port: 1883
  username: "databroker"      
  password: !secret mqtt_password
  discovery: true             
  topic_prefix: esphome/${device_id}

  birth_message:
    topic: esphome/${device_id}/status
    payload: online
    retain: True 

  will_message:
    topic: esphome/${device_id}/status
    payload: offline
    retain: True         

# Enables the web interface when connected to the Esp32-AP hotspot
captive_portal:

# I2C Bus for the BME680
i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO09

# Sensor Data Definition (BME680 Only)
sensor:
  - platform: bme680
    i2c_id: bus_a
    address: 0x77
    update_interval: ${master_update_interval}
    temperature: 
      name: "${device_id} BME680 Temperature"
      oversampling: 16x
    pressure:
      name: "${device_id} BME680 Pressure"
    humidity: 
      name: "${device_id} BME680 Humidity"
    gas_resistance: 
      name: "${device_id} BME680 Gas Resistance"