
#####################################################################################
# PROJECT NAME: ESPHome WiFi BME680
# VERSION: 1.0.2 (Multi-Board Instance Template)
# COLLABORATORS: Brandon J. Winters, Ph.D. & Gemini (AI Adaptive Collaborator)
# REPOSITORY ORIGIN: Developed for local ESP32-S3 sensor deployment via WiFi and MQTT discovery on HA.
# DATE: June 2026
#####################################################################################

esphome:
  name: esp32-wifi-bme680
  friendly_name: ESP32 WiFi BME680

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "LkrF4w8BhBF/K1TMgqNPS1xgwv12s6Aymdr/ONuUNDI="
  reboot_timeout: 
    minutes: 15

ota:
  - platform: esphome
    password: "257f4fc14cdf1f861a35c582fc2758d3"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-Wifi-Bme680"
    password: "YYfLulKu0Gnr"

captive_portal:

# Example configuration entry
i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO09
    #scan: true

# Sensors should be specified as follows
sensor:
  
  - platform: bme680
    i2c_id: bus_a
    address: 0x77
    update_interval: 60s
    temperature:
      name: BME680 Temperature
      oversampling: 16x
    pressure:
      name: BME680 Pressure
    humidity:
      name: BME680 Humidity
    gas_resistance:
      name: BME680 Gas Resistance