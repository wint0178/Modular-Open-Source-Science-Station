# Loads default set of integrations. Do not remove.
default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1  # Allows the local Tailscale Add-on container to pass traffic

##########################################################

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes/

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include templates.yaml
input_number: !include input_numbers.yaml
rest: !include rest.yaml
secrets: !include secrets.yaml
#compensation: !include compensations.yaml
#zone: !include zones.yaml

input_boolean:
  use_tripwire:
    name: "Tripwire Circuit Enabled"
    icon: mdi:wire

recorder:
  purge_keep_days: 30 #set to number of days HA keeps all entity data

rest_command:
  send_woild_downlink:
    url: "https://nam1.cloud.thethings.network/api/v3/as/applications/YOUR_APP_ID/devices/{{ device_id }}/down/replace"
    method: POST
    headers:
      Authorization: !secret ttn_bearer_token
      Content-Type: "application/json"
    payload: >-
      {
        "downlinks": [
          {
            "f_port": 1,
            "decoded_payload": {
              "motion_threshold_lsb": {{ motion_threshold_lsb | default(1) }},
              "software_threshold_lsb": {{ software_threshold_lsb | default(2) }},
              "duration_index": {{ duration_index | default(3) }},
              "minimum_delay_index": {{ minimum_delay_index | default(2) }},
              "trip_alert_index": {{ trip_alert_index | default(2) }},
              "use_tripwire": {{ use_tripwire | default(true) | tojson }}
            },
            "priority": "NORMAL"
          }
        ]
      }

  healthchecks_ping:
    url: !secret healthchecks_ping_url
    method: POST

remote_homeassistant:
  instances:

homeassistant: