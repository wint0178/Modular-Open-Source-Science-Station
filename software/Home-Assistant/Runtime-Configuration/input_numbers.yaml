# input_numbers.yaml

# ============================================================================
# LANDSLIDE NODE X & Y BASELINE ANGLE HELPERS (LD01) [TEXT BOX MODE]
# ============================================================================

# --- NODE 01 ---
ld01_x_baseline:
  name: "LD01 X-Axis Baseline Angle"
  min: -180
  max: 180
  step: 0.01
  mode: box
  unit_of_measurement: "°"
  icon: mdi:axis-x-arrow

ld01_y_baseline:
  name: "LD01 Y-Axis Baseline Angle"
  min: -180
  max: 180
  step: 0.01
  mode: box
  unit_of_measurement: "°"
  icon: mdi:axis-y-arrow
  
# --------------------------------------- #
# Global Landslide Alert Thresholds
# --------------------------------------- #
landslide_creep_threshold:
  name: "Landslide Creep Threshold Vector"
  min: 0.0
  max: 10.0
  step: 0.1
  unit_of_measurement: "°"
  icon: mdi:ruler
  mode: box

landslide_creep_wait_time:
  name: "Landslide Creep Wait Time"
  min: 0
  max: 120
  step: 1
  unit_of_measurement: "min"
  icon: mdi:clock-alert-outline

acceleration_wait_time:
  name: "Acceleration Sustained Wait Time"
  min: 0
  max: 300
  step: 5
  unit_of_measurement: "s"
  icon: mdi:timer-outline

tripwire_wait_time:
  name: "Tripwire Wait Time"
  min: 0
  max: 300
  step: 5
  unit_of_measurement: "s"
  icon: mdi:timer-outline

landslide_sensor_dead_time:
  name: "Landslide Sensor Dead Time"
  min: 0
  max: 2000
  step: 10
  unit_of_measurement: "min"
  icon: mdi:emoticon-dead